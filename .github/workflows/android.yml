name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run android:sync

      - name: Build test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      # Play Store build: only when the release key secrets are set (see ANDROID.md)
      - name: Build signed Play Store bundle
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Collect files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/japsadhna.apk
          cp dist/japsadhna.apk dist/mantra-jaap.apk  # keeps the old download link working
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab dist/japsadhna-play.aab; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: japsadhna-${{ env.VERSION_NAME }}
          path: dist/

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: JapSadhna (जपसाधना) for Android ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            dist/japsadhna.apk
            dist/mantra-jaap.apk
            dist/japsadhna-play.aab
          body: |
            **Install on your phone:** open this page on the phone, tap **japsadhna.apk**, then open the downloaded file.
            If Android asks, allow "Install unknown apps" for your browser. New versions install over the old one.
