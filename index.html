<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f08">
<title>Mantra Jaap Counter</title>
<meta name="description" content="Count your mantra jaap and read prayers with live word highlighting — chant aloud for auto counting, or chant in your mind and tap.">
<style>
  :root {
    --bg: #1a0f08;
    --panel: #2a1a0e;
    --panel2: #3a2414;
    --ink: #fbeedd;
    --muted: #c9a982;
    --saffron: #ff9933;
    --gold: #f4c430;
    --bead: #5a3a1e;
    --ok: #7bd389;
    --warn: #ff6b5b;
    --read-ink: var(--ink);
    --hl: var(--gold);
    --hl-ink: #1a0f08;
    --ts: 22px;
    --on-accent: #1a0f08;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--saffron) 14%, var(--bg)) 0%, var(--bg) 70%);
    background-attachment: fixed; background-size: cover; background-position: center;
    color: var(--ink);
    font-family: "Noto Sans Devanagari", "Mangal", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hidden { display: none !important; }
  h1 { margin: 4px 0 0; font-size: 24px; color: var(--gold); text-align: center; }
  h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; align-self: flex-start; }
  .card { width: 100%; background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  textarea, input[type=number], input[type=text], select {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--bead); border-radius: 10px; padding: 10px 12px;
  }
  textarea { font-size: 18px; min-height: 64px; resize: vertical; line-height: 1.5; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--saffron); outline-offset: 1px; }
  button {
    font: inherit; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
    background: var(--panel2); color: var(--ink);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--saffron); color: var(--on-accent); font-weight: 700; font-size: 18px; width: 100%; padding: 15px; }
  button.primary.on { background: var(--warn); color: #fff; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--panel2); color: var(--ink); font-size: 15px; }
  .chip.sel { background: var(--saffron); color: var(--on-accent); font-weight: 700; }
  .saved { display: flex; flex-direction: column; gap: 8px; }
  .saved-item { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--bead); border-radius: 10px; padding: 4px 4px 4px 12px; }
  .saved-item.sel { border-color: var(--saffron); }
  .saved-item .txt { flex: 1; min-width: 0; text-align: left; background: none; padding: 8px 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-item .n { color: var(--gold); font-size: 13px; white-space: nowrap; }
  .saved-item .del { background: none; color: var(--muted); padding: 8px 10px; }
  .empty { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; width: 100%; align-items: center; }
  .row > * { flex: 1; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .mode {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    padding: 16px 10px; border: 2px solid transparent; background: var(--panel2); border-radius: 14px;
  }
  .mode .ic { font-size: 30px; }
  .mode b { font-size: 16px; }
  .mode span { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .mode.sel { border-color: var(--saffron); background: color-mix(in srgb, var(--panel2) 75%, var(--saffron)); }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.5; text-align: center; margin: 0; }

  /* counter */
  .topbar { display: flex; width: 100%; align-items: center; justify-content: space-between; }
  .badge { font-size: 13px; color: var(--muted); background: var(--panel); padding: 6px 10px; border-radius: 999px; }
  .ptitle { color: var(--gold); font-weight: 700; font-size: 18px; text-align: center; }
  .reader {
    position: relative; width: 100%; max-height: 42vh; overflow-y: auto; scroll-behavior: smooth;
    text-align: center; font-size: var(--ts); line-height: 1.9; color: var(--read-ink); font-weight: 600;
    background: color-mix(in srgb, var(--panel) 80%, transparent); border-radius: 16px; padding: 12px 10px;
    overflow-wrap: anywhere;
  }
  .reader .w { display: inline-block; padding: 0 4px; margin: 1px 0; border-radius: 8px; cursor: pointer; transition: background-color .2s, color .2s, opacity .25s, transform .2s, box-shadow .2s; }
  .reader .w.read { opacity: .45; }
  .reader .w.cur { background: var(--hl); color: var(--hl-ink); transform: scale(1.08); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hl) 35%, transparent), 0 4px 14px rgba(0,0,0,.3); }
  .reader.off .w.read { opacity: 1; }
  .reader.off .w.cur { background: none; color: inherit; transform: none; box-shadow: none; }
  .guide { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .guide .chips { justify-content: center; }
  .guide .chip { font-size: 14px; padding: 7px 12px; }
  .heard { min-height: 18px; font-size: 12px; color: var(--muted); opacity: .8; text-align: center; overflow-wrap: anywhere; }
  .ring-box { position: relative; width: min(80vw, 340px); aspect-ratio: 1; cursor: pointer; user-select: none; }
  .ring-box.small { width: min(56vw, 230px); }
  .ring-box svg { width: 100%; height: 100%; display: block; }
  .bead { fill: var(--bead); transition: fill .25s; }
  .bead.done { fill: var(--saffron); }
  .bead.current { fill: var(--gold); }
  .bead.meru { fill: #b33; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .om { font-size: 32px; color: var(--saffron); opacity: .8; line-height: 1; }
  .ring-box.small .om { font-size: 22px; }
  .count { font-size: clamp(56px, 20vw, 92px); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .ring-box.small .count { font-size: clamp(40px, 13vw, 60px); }
  .of { color: var(--muted); font-size: 16px; }
  .count.bump { animation: bump .3s ease; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); color: var(--gold); } 100% { transform: scale(1); } }
  .stats { display: flex; gap: 10px; width: 100%; }
  .stat { flex: 1; background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .status { min-height: 22px; font-size: 14px; color: var(--muted); text-align: center; }
  .status.live { color: var(--ok); }
  .status.err { color: var(--warn); }
  .meter { width: 100%; height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--saffron), var(--gold)); }
  .meter u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .6; }
  .tapbtn {
    width: 100%; min-height: 140px; border-radius: 20px; font-size: 26px; font-weight: 700;
    background: linear-gradient(180deg, var(--saffron), color-mix(in srgb, var(--saffron) 80%, #000)); color: var(--on-accent);
    box-shadow: 0 6px 0 color-mix(in srgb, var(--saffron) 55%, #000); touch-action: manipulation; user-select: none;
  }
  .tapbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--saffron) 55%, #000); }
  .tapbtn small { display: block; font-size: 14px; font-weight: 500; opacity: .8; margin-top: 4px; }
  details { width: 100%; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
  label.slider { width: 100%; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  input[type=range] { width: 100%; accent-color: var(--saffron); }
  .toast {
    position: fixed; left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--gold); color: #1a0f08; font-weight: 700; padding: 14px 20px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 60; text-align: center; max-width: calc(100% - 32px);
    transition: opacity .3s;
  }
  .toast.off { opacity: 0; pointer-events: none; }

  /* ---------- My mantras dropdown ---------- */
  .fold-head {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 0; background: none;
    color: var(--muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; text-align: left;
  }
  .fold-head .cnt {
    background: var(--panel2); color: var(--gold); border-radius: 999px; padding: 2px 8px;
    font-size: 12px; letter-spacing: 0; text-transform: none;
  }
  .fold-head .chev { margin-left: auto; font-size: 18px; transition: transform .3s ease; }
  .fold.closed .fold-head .chev { transform: rotate(-90deg); }
  .fold-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease, opacity .3s ease; }
  .fold.closed { gap: 0; }
  .fold.closed .fold-body { grid-template-rows: 0fr; opacity: 0; }
  .fold-body > div { overflow: hidden; }
  .saved { max-height: 300px; overflow-y: auto; padding: 2px; }

  /* ---------- bottom sheets (photo, settings) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
  .sheet-card {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel);
    border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; animation: up .25s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head b { font-size: 18px; color: var(--gold); }
  .crop-wrap { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .crop-wrap canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  .progress { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--saffron), var(--gold)); transition: width .2s; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 54px; height: 54px; border-radius: 14px; padding: 0; border: 2px solid transparent; position: relative;
    display: flex; align-items: flex-end; justify-content: center; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; overflow: hidden;
  }
  .swatch span { padding-bottom: 3px; }
  .swatch.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .colors label { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .colors input[type=color] { width: 100%; height: 42px; border: 1px solid var(--bead); border-radius: 10px; background: var(--bg); padding: 3px; cursor: pointer; }
  .fab {
    position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
    width: 56px; height: 56px; border-radius: 50%; padding: 0; font-size: 26px; line-height: 56px;
    background: var(--saffron); color: var(--on-accent); box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .fab span { display: inline-block; transition: transform .4s ease; }

  /* ---------- interaction feedback ---------- */
  button, .saved-item, .ring-box { transition: transform .18s ease, box-shadow .2s ease, filter .2s ease, background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease; }
  :where(button:not(:disabled)):active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (hover: hover) {
    :where(button:not(:disabled)):hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.35); background-color: color-mix(in srgb, var(--panel2) 85%, var(--saffron)); }
    :where(button:not(:disabled)):active { transform: scale(.96); box-shadow: none; }
    button.primary:not(:disabled):hover { background-color: color-mix(in srgb, var(--saffron) 85%, #fff); box-shadow: 0 8px 24px color-mix(in srgb, var(--saffron) 40%, transparent); }
    button.primary.on:not(:disabled):hover { background-color: #ff8475; box-shadow: 0 8px 24px rgba(255,107,91,.35); }
    button.ghost:not(:disabled):hover { background-color: color-mix(in srgb, var(--saffron) 12%, transparent); color: var(--ink); box-shadow: none; }
    .chip:hover { background-color: color-mix(in srgb, var(--panel2) 70%, var(--saffron)); }
    .chip.sel:hover { background-color: color-mix(in srgb, var(--saffron) 85%, #fff); }
    .mode:hover { border-color: color-mix(in srgb, var(--saffron) 50%, transparent); background-color: color-mix(in srgb, var(--panel2) 88%, var(--saffron)); }
    .mode:hover .ic { transform: scale(1.15) rotate(-6deg); }
    .mode.sel:hover { border-color: var(--saffron); background-color: color-mix(in srgb, var(--panel2) 70%, var(--saffron)); }
    .saved-item:hover { border-color: color-mix(in srgb, var(--saffron) 60%, transparent); background-color: color-mix(in srgb, var(--bg) 90%, var(--saffron)); transform: translateX(3px); }
    .saved-item button:hover, .fold-head:hover { transform: none; box-shadow: none; background-color: transparent; }
    .saved-item .txt:hover { color: var(--gold); }
    .saved-item .del:hover { color: var(--warn); transform: scale(1.2); }
    .fold-head:hover { color: var(--ink); }
    .fold-head:hover .chev { color: var(--saffron); }
    .ring-box:hover { transform: scale(1.02); filter: drop-shadow(0 0 18px color-mix(in srgb, var(--saffron) 25%, transparent)); }
    .tapbtn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, var(--saffron) 55%, #000), 0 12px 30px color-mix(in srgb, var(--saffron) 35%, transparent); }
    .tapbtn:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--saffron) 55%, #000); }
    .reader .w:hover:not(.cur) { background: color-mix(in srgb, var(--hl) 22%, transparent); }
    .fab:hover { background-color: var(--saffron); transform: scale(1.08); box-shadow: 0 10px 28px color-mix(in srgb, var(--saffron) 45%, transparent); }
    .fab:hover span { transform: rotate(90deg); }
    .swatch:hover { transform: scale(1.06); }
  }
  .mode .ic { transition: transform .25s ease; }
  .ring-box:active { transform: scale(.98); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div class="wrap" id="setup">
  <h1 data-i18n="appTitle">ॐ Mantra Jaap</h1>

  <div class="card fold" id="savedFold">
    <button class="fold-head" id="foldHead" aria-expanded="true" aria-controls="savedBody">
      <span data-i18n="myMantras">My mantras &amp; prayers</span><span class="cnt" id="savedCount">0</span><span class="chev">▾</span>
    </button>
    <div class="fold-body" id="savedBody"><div><div class="saved" id="savedList"></div></div></div>
  </div>

  <div class="card">
    <h3 data-i18n="mantraLabel">Mantra / prayer</h3>
    <input type="text" id="titleInput" maxlength="80" data-i18n-ph="titlePh">
    <textarea id="mantraInput" data-i18n-ph="mantraPh"></textarea>
    <h3 data-i18n="countLabel">Number of jaap</h3>
    <div class="chips" id="targetChips"></div>
    <div class="row">
      <input type="number" id="targetInput" min="1" max="100000" inputmode="numeric" data-i18n-ph="customCount">
      <button id="saveMantra" data-i18n="save">＋ Save</button>
    </div>
  </div>

  <div class="card">
    <h3 data-i18n="fromPhoto">Add prayer from a photo</h3>
    <div class="row">
      <button id="camBtn" data-i18n="camera">📷 Camera</button>
      <button id="uploadBtn" data-i18n="upload">🖼 Upload image</button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="imgInput" accept="image/*" hidden>
  </div>

  <div class="card">
    <h3 data-i18n="howChant">How will you chant?</h3>
    <div class="modes">
      <button class="mode" data-mode="auto">
        <div class="ic">🎙</div><b data-i18n="autoTitle">Auto counting</b>
        <span data-i18n="autoDesc">Chant aloud — the mic counts each mantra</span>
      </button>
      <button class="mode" data-mode="tap">
        <div class="ic">👆</div><b data-i18n="tapTitle">Tap counting</b>
        <span data-i18n="tapDesc">Chant in your mind — tap once per mantra</span>
      </button>
    </div>
  </div>

  <button class="primary" id="begin" disabled></button>
  <button class="ghost" id="shareSetup" data-i18n="shareLink">🔗 Share link to this mantra</button>
</div>

<!-- ================= COUNTER ================= -->
<div class="wrap hidden" id="counter">
  <div class="topbar">
    <button class="ghost" id="back" data-i18n="change">← Change</button>
    <span class="badge" id="modeBadge"></span>
    <button class="ghost" id="shareCounter" data-i18n="share">🔗 Share</button>
  </div>

  <div class="ptitle hidden" id="pTitle"></div>
  <div class="reader" id="reader"></div>

  <div class="guide">
    <div class="chips" id="guideChips">
      <button class="chip" data-guide="voice" data-i18n="guideVoice">🎙 Follow voice</button>
      <button class="chip" data-guide="pace" data-i18n="guidePace">⏱ Steady pace</button>
      <button class="chip" data-guide="off" data-i18n="guideOff">Highlight off</button>
    </div>
    <label class="slider hidden" id="paceBox">
      <span id="paceLabel"></span>
      <input type="range" id="wpm" min="15" max="180" step="5">
    </label>
    <button id="guideBtn" class="hidden"></button>
    <div class="heard" id="heard"></div>
  </div>

  <div class="ring-box" id="ring">
    <svg viewBox="0 0 200 200" id="beads"></svg>
    <div class="center">
      <div class="om">ॐ</div>
      <div class="count" id="count">0</div>
      <div class="of" id="of">/ 108</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="rounds">0</b><span data-i18n="rounds">Rounds done</span></div>
    <div class="stat"><b id="today">0</b><span data-i18n="today">Jaap today</span></div>
    <div class="stat"><b id="total">0</b><span data-i18n="allTime">All-time</span></div>
  </div>

  <!-- auto mode -->
  <div class="wrap" id="autoBox" style="gap:10px">
    <div class="meter" id="meterBox"><i id="meter"></i><u id="thresh"></u></div>
    <div class="status" id="status"></div>
    <button class="primary" id="start"></button>
    <details id="adjustBox">
      <summary data-i18n="adjust">Adjust auto counting</summary>
      <label class="slider"><span id="gapLabel"></span><input type="range" id="gap" min="0.3" max="2.5" step="0.1"></label>
      <label class="slider"><span id="sensLabel"></span><input type="range" id="sens" min="1" max="10" step="1"></label>
      <label class="slider"><span id="minLabel"></span><input type="range" id="minLen" min="0.4" max="6" step="0.2"></label>
    </details>
  </div>

  <!-- tap mode -->
  <button class="tapbtn hidden" id="tapBtn"><span data-i18n="tap">TAP</span><small data-i18n="tapSub">once after each mantra</small></button>

  <div class="row">
    <button id="minus">− 1</button>
    <button id="reset" data-i18n="resetCount">↺ Reset count</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<!-- ================= PHOTO → TEXT ================= -->
<div class="sheet hidden" id="ocrSheet">
  <div class="sheet-card">
    <div class="sheet-head"><b data-i18n="ocrTitle">Prayer from photo</b><button class="ghost" id="ocrClose" aria-label="Close">✕</button></div>
    <div id="ocrPick">
      <p class="hint" data-i18n="ocrSelect" style="margin-bottom:10px"></p>
      <div class="crop-wrap"><canvas id="ocrCanvas"></canvas></div>
      <div class="row" style="margin-top:10px">
        <button id="ocrRotate" data-i18n="rotate">⟳ Rotate</button>
        <button id="ocrAll" data-i18n="wholeImage">Whole image</button>
      </div>
    </div>
    <button class="primary" id="ocrRun" data-i18n="extract">✨ Extract text</button>
    <div class="progress hidden" id="ocrProg"><i id="ocrBar"></i></div>
    <div class="status" id="ocrStatus"></div>
    <div id="ocrResult" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <input type="text" id="ocrTitle" maxlength="80" data-i18n-ph="titlePh">
      <textarea id="ocrText" rows="9" data-i18n-ph="ocrTextPh"></textarea>

      const worker = await getWorker(lang.ocr, (m) => {
        if (m.status === 'recognizing text') {
          $('ocrBar').style.width = Math.round(10 + m.progress * 90) + '%';
          $('ocrStatus').textContent = t('ocrReading', { p: Math.round(m.progress * 100) });
        } else if (typeof m.progress === 'number') {
          $('ocrBar').style.width = Math.round(3 + m.progress * 7) + '%';
        }
      });
      const { data } = await worker.recognize(ocrInputCanvas());
      const text = cleanOcr(data.text || '', lang.deva);
      $('ocrBar').style.width = '100%';
      if (!text) { $('ocrStatus').className = 'status err'; $('ocrStatus').textContent = t('ocrEmpty'); $('ocrRun').disabled = false; return; }
      $('ocrText').value = text;
      $('ocrCount').value = isLong(text) ? 1 : 108;
      $('ocrPick').classList.add('hidden');
      $('ocrRun').classList.add('hidden');
      $('ocrResult').classList.remove('hidden');
      $('ocrStatus').className = 'status live'; $('ocrStatus').textContent = t('ocrDone');
      setTimeout(() => $('ocrProg').classList.add('hidden'), 400);
    } catch (err) {
      console.error(err);
      $('ocrStatus').className = 'status err'; $('ocrStatus').textContent = t('ocrFail');
      $('ocrProg').classList.add('hidden');
      $('ocrRun').disabled = false;
    }
  };
  function useOcrText(saveIt) {
    const text = $('ocrText').value.trim();
    if (!text) { $('ocrText').focus(); return; }
    const target = clampTarget($('ocrCount').value, 1);
    const title = $('ocrTitle').value.trim();
    if (saveIt) { addSaved(text, target, title); toast(t('saved')); }
    $('mantraInput').value = text; $('titleInput').value = title; setTarget(target);
    renderSaved(); updateBegin();
    $('ocrSheet').classList.add('hidden');
  }
  $('ocrSave').onclick = () => useOcrText(true);
  $('ocrUse').onclick = () => useOcrText(false);

  // test hook (harmless): lets automated tests drive the word matcher
  window.__jaap = { hear: (w) => hear(w), pos: () => pos, words: () => words.length };

  applyTheme();
  showSetup();
  applyI18n();
})();
</script>
</body>
</html>
