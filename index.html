<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140c07">
<title>JapSadhna · जपसाधना</title>
<meta name="description" content="Count your mantra jaap and read prayers with live word highlighting. Chant aloud for automatic counting, or chant in your mind and tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<script type="module" src="js/app.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6M2 2l20 20"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19 14.5 14.5 0 0 1 0-19z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
</svg>

<!-- ================= HOME ================= -->
<main class="view" id="home">
  <header class="appbar">
    <div class="brand">
      <img class="logo" src="img/logo.png" alt="" aria-hidden="true">
      <div><b data-t="brand"></b><small id="todayLine"></small></div>
    </div>
    <button class="account-btn" id="accountBtn" hidden></button>
  </header>

  <button class="find" id="findBtn"><svg class="i"><use href="#i-search"/></svg><span data-t="findPrayer"></span></button>

  <section class="hero" id="hero" hidden>
    <div class="hero-label" data-t="continueLabel"></div>
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-text" id="heroText"></div>
    <div class="bar"><i id="heroBar"></i></div>
    <div class="hero-meta"><span id="heroMeta"></span><span id="heroToday"></span></div>
    <span class="plan-pill" id="heroPlan" hidden style="margin:-4px 0 14px"></span>
    <button class="btn btn-primary btn-lg btn-block" id="heroBtn"><span data-t="continue"></span></button>
  </section>

  <section class="section naam-sec">
    <h2 class="section-title" data-t="naamJap"></h2>
    <div class="naam-row" id="naamRow"></div>
  </section>

  <section class="sadhana" id="sadhana" role="button" tabindex="0">
    <div class="sad-top">
      <div class="sad-streak"><span class="flame" aria-hidden="true">🔥</span><b id="sadStreak">0</b><small id="sadStreakLbl"></small></div>
      <div class="sad-today"><b id="sadToday">0</b><small data-t="jaapToday"></small></div>
    </div>
    <div class="week" id="sadWeek"></div>
    <p class="sad-hint" id="sadHint" data-t="sadHint"></p>
  </section>

  <section class="section lib" id="lib">
    <button class="lib-head" id="libHead" aria-expanded="true" aria-controls="libBody">
      <h2 class="section-title" data-t="library"></h2>
      <span class="badge" id="libCount">0</span>
      <svg class="i chev"><use href="#i-chev"/></svg>
    </button>
    <div class="lib-body" id="libBody"><div><div class="list" id="list"></div></div></div>
  </section>

  <section class="section">
    <h2 class="section-title" data-t="addNew"></h2>
    <div class="add-grid">
      <button class="tile" id="addLibrary"><svg class="i"><use href="#i-book"/></svg><span><b data-t="addLibrary"></b><small data-t="addLibraryHint"></small></span></button>
      <button class="tile" id="addType"><svg class="i"><use href="#i-pen"/></svg><span><b data-t="addType"></b><small data-t="addTypeHint"></small></span></button>
      <button class="tile" id="addCamera"><svg class="i"><use href="#i-camera"/></svg><span><b data-t="addCamera"></b><small data-t="addCameraHint"></small></span></button>
      <button class="tile" id="addPhoto"><svg class="i"><use href="#i-image"/></svg><span><b data-t="addPhoto"></b><small data-t="addPhotoHint"></small></span></button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="imgInput" accept="image/*" hidden>
  </section>
  <div class="home-pad"></div>
  <button class="fab" id="fab" data-t-label="settings"><svg class="i"><use href="#i-gear"/></svg></button>
</main>

<!-- ================= PRACTICE ================= -->
<main class="view practice" id="practice" hidden>
  <header class="appbar">
    <button class="icon-btn" id="pBack" data-t-label="back"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="brand brand-sm"><img class="logo" src="img/logo.png" alt="" aria-hidden="true"><div><b data-t="brand"></b><small id="pMode"></small></div></div>
    <button class="icon-btn" id="pTune" data-t-label="tune" hidden><svg class="i"><use href="#i-sliders"/></svg></button>
    <button class="icon-btn" id="pUndo" data-t-label="undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="icon-btn" id="pShare" data-t-label="share"><svg class="i"><use href="#i-share"/></svg></button>
  </header>

  <div class="guide">
    <div class="segmented" id="guideSeg" role="group">
      <button data-guide="voice"><svg class="i i-sm"><use href="#i-mic"/></svg><span data-t="guideVoice"></span></button>
      <button data-guide="pace"><svg class="i i-sm"><use href="#i-timer"/></svg><span data-t="guidePace"></span></button>
      <button data-guide="off"><svg class="i i-sm"><use href="#i-eyeoff"/></svg><span data-t="guideOff"></span></button>
    </div>
    <button class="icon-btn boxed" id="guideToggle" hidden style="width:48px;height:48px"><svg class="i"><use href="#i-play"/></svg></button>
  </div>
  <label class="pace" id="paceRow" hidden><span id="paceLabel"></span><input type="range" id="wpm" min="15" max="180" step="5"></label>

  <section class="strip" id="strip">
    <div class="mini-ring">
      <svg viewBox="0 0 48 48"><circle class="track" cx="24" cy="24" r="21"/><circle class="arc" id="miniArc" cx="24" cy="24" r="21" stroke-dasharray="131.95" stroke-dashoffset="131.95"/></svg>
      <b id="mCount">0</b>
    </div>
    <div class="strip-main">
      <b id="mOf"></b>
      <small id="mSub"></small>
      <span class="plan-pill" id="mPlan" hidden></span>
    </div>
    <div class="read-bar"><i id="readBar"></i></div>
  </section>

  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <article class="reader" id="reader" lang="sa"><span class="hl-pill" id="hlPill" aria-hidden="true"></span></article>
  <div class="live" id="live"><span class="dot"></span><span id="liveText"></span><span class="heard" id="heard"></span></div>
  <div class="meter" id="meter" hidden><i id="meterLevel"></i><u id="meterTh"></u></div>

  <section class="counter">
    <div class="ring" id="ring" role="button" tabindex="0">
      <svg viewBox="0 0 200 200">
        <defs>
          <radialGradient id="rudraDone" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#d98a4a"/><stop offset=".45" stop-color="#8f4316"/><stop offset="1" stop-color="#4a1e07"/></radialGradient>
          <radialGradient id="rudraTodo" cx="35%" cy="32%" r="75%"><stop offset="0" class="todo-a"/><stop offset="1" class="todo-b"/></radialGradient>
          <radialGradient id="rudraMeru" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffd58a"/><stop offset=".5" stop-color="#e0841f"/><stop offset="1" stop-color="#8a3d06"/></radialGradient>
        </defs>
        <circle class="track" cx="100" cy="100" r="92"/>
        <circle class="ripple" id="ripple" cx="100" cy="100" r="92"/>
        <circle class="arc" id="arc" cx="100" cy="100" r="92" stroke-dasharray="578" stroke-dashoffset="578"/>
        <g class="beads" id="beads"></g>
      </svg>
      <div class="ring-center"><div class="ring-count" id="count">0</div><div class="ring-of" id="of"></div></div>
    </div>
    <span class="plan-pill" id="sPlan" hidden></span>
    <div class="stats">
      <div><b id="sRound">0</b><span data-t="round"></span></div>
      <div><b id="sToday">0</b><span data-t="today"></span></div>
      <div><b id="sTotal">0</b><span data-t="allTime"></span></div>
    </div>
  </section>

  <footer class="action-bar">
    <div>
      <button class="icon-btn boxed" id="resetBtn" data-t-label="reset"><svg class="i"><use href="#i-reset"/></svg></button>
      <button class="btn btn-primary btn-lg" id="mainBtn"></button>
      <button class="icon-btn boxed" id="pSettings" data-t-label="settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </footer>
</main>

<!-- ================= SHEETS ================= -->
<div class="sheet" id="startSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="startTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <p class="sheet-preview" id="startPreview"></p>
      <div>
        <p class="sheet-sub" data-t="howMany"></p>
        <div class="chips" id="countChips"></div>
        <form class="custom-row" id="countForm" hidden>
          <input class="input" type="number" id="countInput" min="1" max="100000" inputmode="numeric" data-t-ph="enterNumber">
          <button class="btn btn-primary" type="submit" data-t="ok"></button>
        </form>
      </div>
      <div>
        <p class="sheet-sub" data-t="howManyDays"></p>
        <div class="chips" id="dayChips"></div>
        <form class="custom-row" id="dayForm" hidden>
          <input class="input" type="number" id="dayInput" min="1" max="3650" inputmode="numeric" data-t-ph="enterNumber">
          <button class="btn btn-primary" type="submit" data-t="ok"></button>
        </form>
        <p class="note" id="dayNote" hidden style="margin-top:8px"></p>
      </div>
      <div>
        <p class="sheet-sub" data-t="howChant"></p>
        <div class="options">
          <button class="option" data-mode="auto" aria-pressed="false">
            <span class="check"><svg class="i"><use href="#i-check"/></svg></span>
            <span class="opt-icon"><svg class="i"><use href="#i-mic"/></svg></span>
            <b data-t="aloud"></b><small data-t="aloudDesc"></small>
          </button>
          <button class="option" data-mode="tap" aria-pressed="false">
            <span class="check"><svg class="i"><use href="#i-check"/></svg></span>
            <span class="opt-icon"><svg class="i"><use href="#i-hand"/></svg></span>
            <b data-t="inMind"></b><small data-t="inMindDesc"></small>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="beginBtn" disabled></button>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="startEdit"><svg class="i i-sm"><use href="#i-pen"/></svg><span data-t="edit"></span></button>
        <button class="btn btn-ghost" id="startShare"><svg class="i i-sm"><use href="#i-share"/></svg><span data-t="share"></span></button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="editSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="editTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <p class="note ok" id="editNote" hidden></p>
      <label class="field"><span data-t="titleLabel"></span><input class="input" id="editName" maxlength="80" data-t-ph="titlePh"></label>
      <label class="field"><span data-t="textLabel"></span><textarea class="textarea" id="editText" data-t-ph="textPh"></textarea></label>
      <button class="btn btn-primary btn-lg btn-block" id="editSave"><span data-t="save"></span></button>
    </div>
  </div>
</div>

<div class="sheet" id="scanSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="scanTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="scanTitle" data-t="scanTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <p class="note" data-t="scanHint"></p>
      <div class="crop"><canvas id="scanCanvas"></canvas></div>
      <div class="row">
        <button class="btn btn-secondary" id="scanRotate"><svg class="i i-sm"><use href="#i-rotate"/></svg><span data-t="rotate"></span></button>
        <button class="btn btn-secondary" id="scanAll"><svg class="i i-sm"><use href="#i-expand"/></svg><span data-t="wholeImage"></span></button>
      </div>
      <div class="progress" id="scanProg" hidden><i id="scanBar"></i></div>
      <p class="note" id="scanNote" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" id="scanRun"><svg class="i"><use href="#i-spark"/></svg><span data-t="extract"></span></button>
    </div>
  </div>
</div>

<div class="sheet" id="tuneSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="tuneTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="tuneTitle" data-t="tune"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <label class="field"><span id="gapLabel"></span><input type="range" id="gap" min="0.3" max="2.5" step="0.1"><small data-t="gapHint"></small></label>
      <label class="field"><span id="sensLabel"></span><input type="range" id="sens" min="1" max="10" step="1"><small data-t="sensHint"></small></label>
      <label class="field"><span id="minLabel"></span><input type="range" id="minLen" min="0.4" max="6" step="0.2"><small data-t="minLenHint"></small></label>
    </div>
  </div>
</div>

<div class="sheet" id="wallSheet" hidden>
  <div class="sheet-panel tall" role="dialog" aria-modal="true" aria-labelledby="wallTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="wallTitle" data-t="wallpapersTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <p class="note" id="wallNote" hidden></p>
    <div class="wall-grid" id="wallGrid"></div>
  </div>
</div>

<div class="sheet full" id="wallView" hidden>
  <div class="wall-view" role="dialog" aria-modal="true" aria-label="Wallpaper">
    <div class="wall-img" id="wallImg"></div>
    <button class="icon-btn wall-close" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button>
    <div class="wall-actions">
      <button class="btn btn-primary" id="wallSet"><svg class="i i-sm"><use href="#i-check"/></svg><span data-t="setInApp"></span></button>
      <button class="btn btn-secondary" id="wallSave"><svg class="i i-sm"><use href="#i-image"/></svg><span data-t="saveImage"></span></button>
      <button class="icon-btn boxed" id="wallShare" data-t-label="share"><svg class="i"><use href="#i-share"/></svg></button>
    </div>
  </div>
</div>

<div class="sheet" id="statsSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="statsTitle" data-t="mySadhana"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <div class="stat-grid" id="statGrid"></div>
      <h3 class="section-title" style="margin:0" data-t="last30"></h3>
      <div class="month" id="statMonth"></div>
      <h3 class="section-title" style="margin:0" data-t="byMantra"></h3>
      <div class="by-mantra" id="statMantras"></div>
    </div>
  </div>
</div>

<div class="sheet" id="setSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="setTitle" data-t="settings"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <button class="wall-card" id="openWalls">
        <span class="wall-card-head"><b data-t="wallpapersTitle"></b><small id="wallCount"></small><span class="see-all" data-t="seeAll"></span></span>
        <span class="wall-strip" id="wallStrip"><i></i><i></i><i></i><i></i></span>
      </button>
      <label class="field peekable" id="dimRow"><span id="dimLabel"></span><input type="range" id="dim" min="0" max="0.9" step="0.05"></label>
      <label class="field peekable" id="cardRow"><span id="cardLabel"></span><input type="range" id="cardA" min="0" max="0.9" step="0.05"></label>
      <label class="field peekable" id="blurRow"><span id="blurLabel"></span><input type="range" id="cardBlur" min="0" max="30" step="1"></label>
      <div class="field peekable" id="colorsRow"><span data-t="colors"></span>
        <div class="colors">
          <label><span data-t="bgColor"></span><input type="color" id="cBg"></label>
          <label><span data-t="textColor"></span><input type="color" id="cText"></label>
          <label><span data-t="hlColor"></span><input type="color" id="cHl"></label>
        </div>
        <button class="btn btn-ghost" id="colorsReset" style="align-self:flex-start;min-height:40px;padding:0 8px"><svg class="i i-sm"><use href="#i-reset"/></svg><span data-t="resetColors"></span></button>
      </div>
      <div class="callout" id="guestNote" hidden>
        <p data-t="guestNote"></p>
        <button class="btn btn-primary" id="guestSignIn"><span data-t="signIn"></span></button>
      </div>
      <h3 class="section-title" style="margin:0" data-t="language"></h3>
      <div class="field"><span data-t="appLang"></span>
        <div class="segmented" id="uiLangSeg">
          <button data-v="en">English</button><button data-v="hi">हिन्दी</button><button data-v="mr">मराठी</button>
        </div>
      </div>
      <label class="field"><span data-t="voiceLang"></span><select class="select" id="voiceLang"></select><small data-t="voiceLangHint"></small></label>

      <div class="divider"></div>
      <h3 class="section-title" style="margin:0" data-t="soundVibe"></h3>
      <div class="field"><span data-t="beadSound"></span>
        <div class="segmented" id="soundSeg"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
      </div>
      <div class="field"><span data-t="vibration"></span>
        <div class="segmented" id="vibeSeg"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
      </div>

      <div class="divider"></div>
      <h3 class="section-title" style="margin:0" data-t="appearance"></h3>
      <div class="field"><span data-t="theme"></span><div class="swatches" id="themeSw"></div></div>
      <div class="field"><span data-t="prayerFont"></span>
        <div class="segmented" id="fontSeg"><button data-v="classic" data-t="fontClassic"></button><button data-v="modern" data-t="fontModern"></button></div>
      </div>
      <div class="field"><span id="tsLabel"></span><input type="range" id="ts" min="18" max="44" step="1">
        <div class="preview-line"><span class="w read">ॐ</span> <span class="w cur">नमः</span> <span class="w">शिवाय</span></div>
      </div>
      <div class="field"><span data-t="wallpaper"></span><div class="swatches" id="wpSw"></div><input type="file" id="wpInput" accept="image/*" hidden></div>
      <div class="divider"></div>
      <a class="policy-link" href="privacy" target="_blank" rel="noopener" data-t="privacy"></a>
      <button class="policy-link" id="adPrivacyBtn" data-t="adPrivacy" hidden></button>
      <button class="btn btn-ghost" id="setReset"><svg class="i i-sm"><use href="#i-reset"/></svg><span data-t="resetSettings"></span></button>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary btn-lg btn-block" id="setSave"><svg class="i"><use href="#i-check"/></svg><span data-t="saveSettings"></span></button>
    </div>
  </div>
</div>

<div class="sheet" id="libSheet" hidden>
  <div class="sheet-panel tall" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="libTitle" data-t="prayerLibrary"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <label class="search-box"><svg class="i"><use href="#i-search"/></svg><input type="search" id="libQuery" enterkeyhint="search" autocomplete="off" data-t-ph="searchPh"></label>
      <div class="scroll-chips" id="libLangs" role="group"></div>
      <div class="scroll-chips" id="libCats" role="group"></div>
      <div class="lib-results" id="libResults"></div>
      <p class="note" data-t="libNote"></p>
      <div class="online">
        <h3 class="section-title"><svg class="i i-sm"><use href="#i-globe"/></svg> <span data-t="onlineTitle"></span></h3>
        <button class="btn btn-secondary btn-block" id="onlineBtn"></button>
        <p class="note" data-t="pasteHint"></p>
        <button class="btn btn-ghost btn-block" id="pasteBtn"><svg class="i"><use href="#i-plus"/></svg><span data-t="pasteBtn"></span></button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="prevSheet" hidden>
  <div class="sheet-panel tall" role="dialog" aria-modal="true" aria-labelledby="prevTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="prevTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <p class="note" id="prevMeta"></p>
      <div class="prev-text" id="prevText"></div>
      <button class="btn btn-primary btn-lg btn-block" id="prevAdd"></button>
    </div>
  </div>
</div>

<div class="sheet" id="authSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="authTitle"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack" id="authMain">
      <p class="note" data-t="authWhy"></p>
      <button class="btn btn-secondary btn-lg btn-block" id="googleBtn"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-t="continueGoogle"></span></button>
      <div class="or"><span data-t="orText"></span></div>
      <form class="stack" id="authForm" style="gap:14px" novalidate>
        <label class="field"><span data-t="email"></span><input class="input" type="email" id="authEmail" autocomplete="email" inputmode="email"></label>
        <label class="field"><span data-t="password"></span><input class="input" type="password" id="authPw" autocomplete="current-password"></label>
        <p class="note" id="authNote" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="authSubmit"></button>
      </form>
      <div class="auth-links">
        <button class="btn btn-ghost" id="authSwitch"></button>
        <button class="btn btn-ghost" id="authForgot" data-t="forgot"></button>
      </div>
      <a class="policy-link" href="privacy" target="_blank" rel="noopener" data-t="privacy"></a>
    </div>
    <form class="stack" id="recoverForm" hidden novalidate>
      <label class="field"><span data-t="newPassword"></span><input class="input" type="password" id="newPw" autocomplete="new-password"></label>
      <p class="note" id="recoverNote" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit"><span data-t="setPassword"></span></button>
    </form>
  </div>
</div>

<div class="sheet" id="accountSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="accTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h2 id="accTitle" data-t="account"></h2><button class="icon-btn" data-close data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <div class="profile"><span class="avatar avatar-lg" id="accAvatar"></span><div><b id="accName"></b><small id="accEmail"></small></div></div>
      <p class="note ok" data-t="synced"></p>
      <button class="btn btn-secondary btn-lg btn-block" id="signOutBtn"><span data-t="signOut"></span></button>
      <button class="policy-link btn-danger" id="deleteAccBtn" data-t="deleteAccount"></button>
    </div>
  </div>
</div>

<div class="toast off" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
